<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registra in BDN — Gestione Microchip</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dark.css" id="dark-theme-link" disabled>
</head>
<body>
    <header class="app-header">
        <a href="../index.html" class="btn-back" aria-label="Torna alla home">← Home</a>
        <h1 class="app-title">Registra in BDN</h1>
    </header>

    <main class="main-content">
        <section class="form-container">
            <div class="form-group">
                <label for="gatto-select">Seleziona gatto adottato</label>
                <select id="gatto-select" name="gatto_select">
                    <option value="">— Seleziona —</option>
                </select>
                <span class="error-msg" id="gatto-select-error"></span>
            </div>

            <form id="registra-bdn-form" novalidate>
                <div class="form-group">
                    <label for="data-registrazione">Data registrazione BDN</label>
                    <input type="date" id="data-registrazione" name="data_registrazione_bdn" required>
                    <span class="error-msg" id="data-registrazione-error"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Conferma registrazione</button>
            </form>

            <p id="empty-message" class="info-message" hidden>Non ci sono gatti da registrare.</p>
        </section>
    </main>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
