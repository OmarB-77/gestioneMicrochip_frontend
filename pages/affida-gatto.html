<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affida Gatto — Gestione Microchip</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dark.css" id="dark-theme-link" disabled>
</head>
<body>
    <header class="app-header">
        <a href="../index.html" class="btn-back" aria-label="Torna alla home">← Home</a>
        <h1 class="app-title">Affida Gatto</h1>
    </header>

    <main class="main-content">
        <section class="form-container">
            <!-- Selezione gatto impiantato -->
            <h2 class="form-title">Seleziona gatto impiantato</h2>

            <div class="form-group">
                <label for="gatto-search">Cerca per numero chip</label>
                <input type="text" id="gatto-search" placeholder="Digita almeno 3 cifre..."
                       inputmode="numeric" autocomplete="off">
            </div>

            <button type="button" id="btn-scan" class="btn btn-secondary btn-full">
                📷 Scansiona barcode
            </button>
            <div id="scanner-container" class="scanner-area" hidden></div>

            <div id="gatto-list-container">
                <div class="search-results" id="gatto-list" role="listbox" aria-label="Lista gatti impiantati">
                    <!-- Populated dynamically -->
                </div>
                <p class="info-message" id="gatto-list-empty" hidden>Nessun gatto disponibile per l'adozione</p>
                <p class="info-message" id="gatto-list-loading">Caricamento gatti...</p>
            </div>

            <span class="error-msg" id="gatto-select-error"></span>

            <!-- Form adozione (hidden until a cat is selected) -->
            <form id="affida-gatto-form" novalidate hidden>
                <h2 class="form-section-title">Gatto selezionato</h2>
                <div class="form-group">
                    <label for="chip-selezionato">Numero chip</label>
                    <input type="text" id="chip-selezionato" readonly>
                </div>

                <!-- Sezione dati gatto -->
                <h2 class="form-section-title">Dati gatto</h2>

                <div class="form-group">
                    <label for="nome-gatto-adozione">Nome gatto (post-adozione)</label>
                    <input type="text" id="nome-gatto-adozione" name="nome_gatto_adozione" maxlength="50"
                           placeholder="Se diverso dal nome attuale">
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="tipologia-pelo">Tipologia pelo</label>
                    <select id="tipologia-pelo" name="tipologia_pelo">
                        <option value="">— Seleziona —</option>
                        <option value="corto">Corto</option>
                        <option value="mezzo pelo">Mezzo pelo</option>
                        <option value="lungo">Lungo</option>
                    </select>
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="data-adozione">Data di adozione</label>
                    <input type="date" id="data-adozione" name="data_adozione" required>
                    <span class="error-msg"></span>
                </div>

                <!-- Sezione dati adottante -->
                <h2 class="form-section-title">Dati adottante</h2>

                <button type="button" id="btn-leggi-cie" class="btn btn-secondary btn-full">
                    📄 Leggi documenti d'identità
                </button>

                <!-- Document photo inputs (hidden until user taps button) -->
                <div id="doc-inputs" hidden>
                    <p class="info-message">Fotografa i documenti disponibili per precompilare i campi automaticamente.</p>

                    <div class="form-group doc-input-group">
                        <label>📋 Retro carta d'identità (lato codice a barre + MRZ)</label>
                        <button type="button" class="btn btn-secondary btn-full doc-pick-btn" data-doc="cie-retro">
                            Seleziona immagine...
                        </button>
                        <span class="doc-filename" id="cie-retro-filename"></span>
                        <input type="file" id="cie-retro-camera" accept="image/*" capture="environment" hidden>
                        <input type="file" id="cie-retro-gallery" accept="image/*" hidden>
                    </div>

                    <div class="form-group doc-input-group">
                        <label>📋 Fronte carta d'identità (lato foto)</label>
                        <button type="button" class="btn btn-secondary btn-full doc-pick-btn" data-doc="cie-fronte">
                            Seleziona immagine...
                        </button>
                        <span class="doc-filename" id="cie-fronte-filename"></span>
                        <input type="file" id="cie-fronte-camera" accept="image/*" capture="environment" hidden>
                        <input type="file" id="cie-fronte-gallery" accept="image/*" hidden>
                    </div>

                    <div class="form-group doc-input-group">
                        <label>💚 Fronte tessera sanitaria (lato dati)</label>
                        <button type="button" class="btn btn-secondary btn-full doc-pick-btn" data-doc="ts-fronte">
                            Seleziona immagine...
                        </button>
                        <span class="doc-filename" id="ts-fronte-filename"></span>
                        <input type="file" id="ts-fronte-camera" accept="image/*" capture="environment" hidden>
                        <input type="file" id="ts-fronte-gallery" accept="image/*" hidden>
                    </div>

                    <div class="form-group doc-input-group">
                        <label>💚 Retro tessera sanitaria (lato codice a barre)</label>
                        <button type="button" class="btn btn-secondary btn-full doc-pick-btn" data-doc="ts-retro">
                            Seleziona immagine...
                        </button>
                        <span class="doc-filename" id="ts-retro-filename"></span>
                        <input type="file" id="ts-retro-camera" accept="image/*" capture="environment" hidden>
                        <input type="file" id="ts-retro-gallery" accept="image/*" hidden>
                    </div>

                    <button type="button" id="btn-extract" class="btn btn-primary btn-full">🔍 Estrai dati dai documenti</button>
                    <p class="info-message" id="extract-status" hidden></p>
                </div>

                <!-- Photo source popup (action sheet) -->
                <div id="photo-popup" class="photo-popup" hidden>
                    <div class="photo-popup-backdrop"></div>
                    <div class="photo-popup-menu">
                        <button type="button" class="photo-popup-option" id="popup-camera">📷 Scatta foto</button>
                        <button type="button" class="photo-popup-option" id="popup-gallery">📁 Scegli da galleria</button>
                        <button type="button" class="photo-popup-option photo-popup-cancel">Annulla</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="adottante-nome">Nome</label>
                    <input type="text" id="adottante-nome" name="adottante_nome" maxlength="50"
                           required placeholder="Nome dell'adottante">
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="adottante-cognome">Cognome</label>
                    <input type="text" id="adottante-cognome" name="adottante_cognome" maxlength="50"
                           required placeholder="Cognome dell'adottante">
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="adottante-cf">Codice fiscale</label>
                    <input type="text" id="adottante-cf" name="adottante_cf" maxlength="16"
                           required placeholder="RSSMRA80A01H501U" autocapitalize="characters">
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="adottante-data-nascita">Data di nascita</label>
                    <input type="date" id="adottante-data-nascita" name="adottante_data_nascita" required>
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="adottante-luogo-nascita">Luogo di nascita</label>
                    <input type="text" id="adottante-luogo-nascita" name="adottante_luogo_nascita"
                           placeholder="Comune di nascita">
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="adottante-residenza">Residenza</label>
                    <input type="text" id="adottante-residenza" name="adottante_residenza" maxlength="200"
                           required placeholder="Via/Piazza, CAP Città (Prov)">
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="adottante-telefono">Telefono</label>
                    <input type="tel" id="adottante-telefono" name="adottante_telefono" maxlength="20"
                           required placeholder="+39 333 1234567">
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="adottante-documento">Numero documento</label>
                    <input type="text" id="adottante-documento" name="adottante_numero_documento">
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="adottante-scadenza-doc">Scadenza documento</label>
                    <input type="date" id="adottante-scadenza-doc" name="adottante_scadenza_documento">
                    <span class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="numero-scheda">Numero scheda</label>
                    <input type="text" id="numero-scheda" name="numero_scheda" required
                           placeholder="Numero scheda adozione">
                    <span class="error-msg"></span>
                </div>

                <div class="form-group form-group-checkbox">
                    <input type="checkbox" id="privacy" name="privacy_autorizzata" required>
                    <label for="privacy">L'adottante ha autorizzato all'utilizzo dei dati personali</label>
                    <span class="error-msg"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Conferma adozione</button>
            </form>
        </section>
    </main>

    <script type="module">
        import { protectPage } from '../js/router.js'
        import { initDarkMode, showToast, showFieldError, clearAllErrors, scrollToFirstError } from '../js/ui-utils.js'
        import { validateCodiceFiscale } from '../js/validation.js'
        import { supabase } from '../js/supabase-client.js'
        import { startScan, stopScan } from '../js/scanner.js'
        import { extractDocumentData } from '../js/ocr.js'

        // Inizializza dark mode
        initDarkMode()

        // Guard: admin e guest possono accedere
        const ctx = await protectPage(['admin', 'guest'])
        if (!ctx) throw new Error('Accesso negato')

        const { role, associazione: userAssociazioneId } = ctx

        // =====================================================================
        // DOM References
        // =====================================================================
        const gattoSearch = document.getElementById('gatto-search')
        const gattoList = document.getElementById('gatto-list')
        const gattoListEmpty = document.getElementById('gatto-list-empty')
        const gattoListLoading = document.getElementById('gatto-list-loading')
        const gattoSelectError = document.getElementById('gatto-select-error')
        const btnScan = document.getElementById('btn-scan')
        const scannerContainer = document.getElementById('scanner-container')
        const form = document.getElementById('affida-gatto-form')
        const chipSelezionato = document.getElementById('chip-selezionato')
        const btnLeggiCie = document.getElementById('btn-leggi-cie')
        const docInputs = document.getElementById('doc-inputs')
        const btnExtract = document.getElementById('btn-extract')
        const extractStatus = document.getElementById('extract-status')

        // Popup elements
        const photoPopup = document.getElementById('photo-popup')
        const popupCamera = document.getElementById('popup-camera')
        const popupGallery = document.getElementById('popup-gallery')
        const popupCancel = photoPopup.querySelector('.photo-popup-cancel')
        const popupBackdrop = photoPopup.querySelector('.photo-popup-backdrop')
        let activeDocId = null  // which document is being picked

        // Document file references (stores the selected File for each doc)
        const docFiles = { 'cie-retro': null, 'cie-fronte': null, 'ts-fronte': null, 'ts-retro': null }

        // =====================================================================
        // State
        // =====================================================================
        let allCats = []           // All implanted cats from DB
        let selectedCat = null     // Currently selected cat object

        // =====================================================================
        // Init: load implanted cats
        // =====================================================================

        // Set today's date as default and max for data-adozione
        const today = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') })()
        const dataAdozioneInput = document.getElementById('data-adozione')
        dataAdozioneInput.value = today
        dataAdozioneInput.max = today

        async function loadCats() {
            gattoListLoading.hidden = false
            gattoListEmpty.hidden = true
            gattoList.innerHTML = ''

            let query = supabase
                .from('chips')
                .select('id, numero_chip, nome_gatto, tipologia_pelo, associazione_id, data_impianto')
                .eq('stato', 'impiantato')
                .order('nome_gatto', { ascending: true })

            // Guest: filter by own association
            if (role === 'guest' && userAssociazioneId) {
                query = query.eq('associazione_id', userAssociazioneId)
            }

            const { data, error } = await query

            gattoListLoading.hidden = true

            if (error) {
                showToast('Errore nel caricamento dei gatti', 'error')
                gattoListEmpty.textContent = 'Errore nel caricamento'
                gattoListEmpty.hidden = false
                return
            }

            allCats = data || []

            if (allCats.length === 0) {
                gattoListEmpty.hidden = false
            } else {
                renderCatList(allCats)
            }
        }

        await loadCats()

        // =====================================================================
        // Render cat list
        // =====================================================================
        function renderCatList(cats) {
            gattoList.innerHTML = ''
            gattoListEmpty.hidden = true

            if (cats.length === 0) {
                gattoListEmpty.textContent = 'Nessun gatto corrisponde alla ricerca'
                gattoListEmpty.hidden = false
                return
            }

            cats.forEach(cat => {
                const item = document.createElement('div')
                item.className = 'result-item'
                item.role = 'option'
                item.tabIndex = 0
                item.dataset.catId = cat.id
                item.innerHTML = `
                    <span>${escapeHtml(cat.nome_gatto || 'Senza nome')}</span>
                    <span style="font-size:0.75rem;color:#666">${escapeHtml(cat.numero_chip)}</span>
                `
                item.addEventListener('click', () => selectCat(cat))
                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault()
                        selectCat(cat)
                    }
                })
                gattoList.appendChild(item)
            })
        }

        /** Escape HTML to prevent XSS */
        function escapeHtml(str) {
            if (!str) return ''
            const div = document.createElement('div')
            div.textContent = str
            return div.innerHTML
        }

        // =====================================================================
        // Search/filter cats (client-side)
        // =====================================================================
        gattoSearch.addEventListener('input', () => {
            const query = gattoSearch.value.trim()
            if (query.length === 0) {
                renderCatList(allCats)
                return
            }
            const filtered = allCats.filter(c =>
                c.numero_chip.includes(query) ||
                (c.nome_gatto && c.nome_gatto.toLowerCase().includes(query.toLowerCase()))
            )
            renderCatList(filtered)
        })

        // =====================================================================
        // Select a cat → show adoption form
        // =====================================================================
        function selectCat(cat) {
            selectedCat = cat
            chipSelezionato.value = cat.numero_chip
            gattoSelectError.textContent = ''

            // Pre-fill cat name for adoption (editable)
            const nomeGattoInput = document.getElementById('nome-gatto-adozione')
            nomeGattoInput.value = cat.nome_gatto || ''

            // Pre-fill tipologia pelo from existing data
            document.getElementById('tipologia-pelo').value = cat.tipologia_pelo || ''

            // Show the form
            form.hidden = false
            form.scrollIntoView({ behavior: 'smooth', block: 'start' })
        }

        // =====================================================================
        // Scanner
        // =====================================================================
        let scanning = false

        btnScan.addEventListener('click', async () => {
            if (scanning) {
                await stopScan()
                scannerContainer.hidden = true
                btnScan.textContent = '📷 Scansiona barcode'
                scanning = false
                return
            }

            scanning = true
            scannerContainer.hidden = false
            btnScan.textContent = '✕ Chiudi scanner'

            await startScan(
                'scanner-container',
                // onSuccess
                (decodedText) => {
                    scanning = false
                    scannerContainer.hidden = true
                    btnScan.textContent = '📷 Scansiona barcode'

                    // Find the cat among implanted ones
                    const found = allCats.find(c => c.numero_chip === decodedText)
                    if (found) {
                        selectCat(found)
                        showToast(`Gatto "${found.nome_gatto || decodedText}" selezionato`, 'success')
                    } else {
                        showToast('Microchip non associato a nessun gatto disponibile per l\'adozione', 'error')
                    }
                },
                // onError
                (errorType) => {
                    scanning = false
                    scannerContainer.hidden = true
                    btnScan.textContent = '📷 Scansiona barcode'

                    if (errorType === 'TIMEOUT') {
                        showToast('Scansione non riuscita entro il tempo limite. Riprova o procedi manualmente.', 'error')
                    } else {
                        showToast('Impossibile accedere alla fotocamera. Verifica i permessi.', 'error')
                    }
                }
            )
        })

        // =====================================================================
        // Document Reading Pipeline (Multi-source extraction)
        // =====================================================================
        btnLeggiCie.addEventListener('click', () => {
            docInputs.hidden = !docInputs.hidden
            if (!docInputs.hidden) {
                btnLeggiCie.textContent = '✕ Chiudi lettura documenti'
            } else {
                btnLeggiCie.textContent = '📄 Leggi documenti d\'identità'
            }
        })

        // =====================================================================
        // Photo Popup (action sheet) logic
        // =====================================================================

        // Show popup on button click
        document.querySelectorAll('.doc-pick-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activeDocId = btn.dataset.doc
                photoPopup.hidden = false
            })
        })

        // Camera option
        popupCamera.addEventListener('click', () => {
            photoPopup.hidden = true
            document.getElementById(activeDocId + '-camera').click()
        })

        // Gallery option
        popupGallery.addEventListener('click', () => {
            photoPopup.hidden = true
            document.getElementById(activeDocId + '-gallery').click()
        })

        // Cancel / backdrop
        popupCancel.addEventListener('click', () => { photoPopup.hidden = true })
        popupBackdrop.addEventListener('click', () => { photoPopup.hidden = true })

        // Handle file selection (both camera and gallery inputs)
        document.querySelectorAll('[id$="-camera"], [id$="-gallery"]').forEach(input => {
            input.addEventListener('change', (e) => {
                const file = e.target.files[0]
                if (!file) return
                // Determine which doc this belongs to (strip -camera or -gallery suffix)
                const docId = input.id.replace(/-camera$/, '').replace(/-gallery$/, '')
                docFiles[docId] = file
                // Show filename
                const filenameEl = document.getElementById(docId + '-filename')
                if (filenameEl) filenameEl.textContent = file.name
                // Update button text
                const btn = document.querySelector(`[data-doc="${docId}"]`)
                if (btn) btn.textContent = '✓ ' + file.name.substring(0, 20) + (file.name.length > 20 ? '...' : '')
            })
        })

        // Extract button: collects all available files and runs multi-source extraction
        btnExtract.addEventListener('click', async () => {
            const cieRetroFile = docFiles['cie-retro']
            const cieFronteFile = docFiles['cie-fronte']
            const tsFronteFile = docFiles['ts-fronte']
            const tsRetroFile = docFiles['ts-retro']

            if (!cieRetroFile && !cieFronteFile && !tsFronteFile && !tsRetroFile) {
                showToast('Seleziona almeno una foto di un documento', 'error')
                return
            }

            extractStatus.textContent = 'Elaborazione in corso...'
            extractStatus.hidden = false
            btnExtract.disabled = true

            try {
                const { fields, errors } = await extractDocumentData({
                    cieRetro: cieRetroFile,
                    cieFronte: cieFronteFile,
                    tsFronte: tsFronteFile,
                    tsRetro: tsRetroFile
                })

                // Fill form fields with extracted data
                fillFieldsFromExtraction(fields)

                // Determine success level
                const filledCount = Object.values(fields).filter(v => v !== null).length
                if (filledCount === 0) {
                    extractStatus.textContent = ''
                    extractStatus.hidden = true
                    showToast('Impossibile estrarre dati dai documenti. Inserisci i dati manualmente.', 'error')
                } else if (errors.length > 0) {
                    extractStatus.textContent = `Dati parzialmente estratti (${filledCount} campi)`
                    extractStatus.hidden = false
                    setTimeout(() => { extractStatus.hidden = true }, 4000)
                    showToast('Alcuni dati estratti con successo. Verifica i campi.', 'success')
                } else {
                    extractStatus.textContent = `Dati estratti con successo (${filledCount} campi)`
                    extractStatus.hidden = false
                    setTimeout(() => { extractStatus.hidden = true }, 4000)
                    showToast('Dati estratti con successo!', 'success')
                }
            } catch (err) {
                extractStatus.textContent = ''
                extractStatus.hidden = true
                showToast('Errore durante la lettura dei documenti. Inserisci i dati manualmente.', 'error')
            } finally {
                btnExtract.disabled = false
            }
        })

        /**
         * Fill adoption form fields from multi-source extraction results.
         * Handles partial data: fills only what was successfully extracted.
         */
        function fillFieldsFromExtraction(fields) {
            if (fields.nome) {
                document.getElementById('adottante-nome').value = capitalizeWords(fields.nome)
            }
            if (fields.cognome) {
                document.getElementById('adottante-cognome').value = capitalizeWords(fields.cognome)
            }
            if (fields.codiceFiscale) {
                document.getElementById('adottante-cf').value = fields.codiceFiscale.toUpperCase()
            }
            if (fields.dataNascita) {
                // dataNascita could be YYYY-MM-DD (from CF decode) or YYMMDD (from MRZ)
                let dobDate = null
                if (fields.dataNascita.includes('-')) {
                    // Already in ISO format
                    dobDate = fields.dataNascita
                } else if (fields.dataNascita.length === 6) {
                    // YYMMDD format from MRZ
                    dobDate = mrzDateToISO(fields.dataNascita)
                }
                if (dobDate) {
                    document.getElementById('adottante-data-nascita').value = dobDate
                }
            }
            if (fields.luogoNascita) {
                document.getElementById('adottante-luogo-nascita').value = fields.luogoNascita
            }
            if (fields.indirizzo) {
                document.getElementById('adottante-residenza').value = fields.indirizzo
            }
            if (fields.numeroDocumento) {
                document.getElementById('adottante-documento').value = fields.numeroDocumento.trim()
            }
            if (fields.dataScadenza && fields.dataScadenza.length === 6) {
                const expDate = mrzDateToISO(fields.dataScadenza, true)
                if (expDate) {
                    document.getElementById('adottante-scadenza-doc').value = expDate
                }
            }
        }

        /**
         * Convert MRZ date (YYMMDD) to ISO format (YYYY-MM-DD).
         * For birth dates: 00-99 → 1920-2020 (assume past)
         * For expiry dates: 00-99 → 2000-2099 (assume future)
         */
        function mrzDateToISO(mrzDate, isFutureDate = false) {
            if (!mrzDate || mrzDate.length !== 6) return null

            const yy = parseInt(mrzDate.substring(0, 2), 10)
            const mm = mrzDate.substring(2, 4)
            const dd = mrzDate.substring(4, 6)

            let year
            if (isFutureDate) {
                year = 2000 + yy
            } else {
                // Birth date: if yy > current year's last 2 digits, it's 1900s
                const currentYY = new Date().getFullYear() % 100
                year = yy > currentYY ? 1900 + yy : 2000 + yy
            }

            // Validate the resulting date
            const dateStr = `${year}-${mm}-${dd}`
            const date = new Date(dateStr)
            if (isNaN(date.getTime())) return null

            return dateStr
        }

        /**
         * Capitalize first letter of each word.
         */
        function capitalizeWords(str) {
            if (!str) return ''
            return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase())
        }

        // =====================================================================
        // Form submission
        // =====================================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault()
            clearAllErrors(form)

            if (!selectedCat) {
                gattoSelectError.textContent = 'Seleziona un gatto prima di procedere'
                return
            }

            // Read form values
            const nomeGattoAdozione = document.getElementById('nome-gatto-adozione').value.trim()
            const dataAdozione = document.getElementById('data-adozione').value
            const adottanteNome = document.getElementById('adottante-nome').value.trim()
            const adottanteCognome = document.getElementById('adottante-cognome').value.trim()
            const adottanteCf = document.getElementById('adottante-cf').value.trim().toUpperCase()
            const adottanteDataNascita = document.getElementById('adottante-data-nascita').value
            const adottanteResidenza = document.getElementById('adottante-residenza').value.trim()
            const adottanteTelefono = document.getElementById('adottante-telefono').value.trim()
            const adottanteDocumento = document.getElementById('adottante-documento').value.trim()
            const adottanteScadenzaDoc = document.getElementById('adottante-scadenza-doc').value
            const adottanteLuogoNascita = document.getElementById('adottante-luogo-nascita').value.trim()
            const numeroScheda = document.getElementById('numero-scheda').value.trim()
            const privacyCheckbox = document.getElementById('privacy')
            const privacyChecked = privacyCheckbox.checked

            // ========== Validation ==========
            let hasErrors = false

            // Data adozione: required, not future
            const dataAdozioneEl = document.getElementById('data-adozione')
            if (!dataAdozione) {
                showFieldError(dataAdozioneEl, 'La data di adozione è obbligatoria')
                hasErrors = true
            } else {
                const todayStr = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') })()
                if (dataAdozione > todayStr) {
                    showFieldError(dataAdozioneEl, 'La data non può essere nel futuro')
                    hasErrors = true
                }
            }

            // Adottante nome: required, max 50
            const nomeEl = document.getElementById('adottante-nome')
            if (!adottanteNome) {
                showFieldError(nomeEl, 'Il nome dell\'adottante è obbligatorio')
                hasErrors = true
            } else if (adottanteNome.length > 50) {
                showFieldError(nomeEl, 'Massimo 50 caratteri')
                hasErrors = true
            }

            // Adottante cognome: required, max 50
            const cognomeEl = document.getElementById('adottante-cognome')
            if (!adottanteCognome) {
                showFieldError(cognomeEl, 'Il cognome dell\'adottante è obbligatorio')
                hasErrors = true
            } else if (adottanteCognome.length > 50) {
                showFieldError(cognomeEl, 'Massimo 50 caratteri')
                hasErrors = true
            }

            // Codice fiscale: required, validate with full algorithm
            const cfEl = document.getElementById('adottante-cf')
            if (!adottanteCf) {
                showFieldError(cfEl, 'Il codice fiscale è obbligatorio')
                hasErrors = true
            } else {
                const cfResult = validateCodiceFiscale(adottanteCf)
                if (!cfResult.valid) {
                    showFieldError(cfEl, cfResult.error)
                    hasErrors = true
                }
            }

            // Data nascita adottante: required
            const dataNascitaEl = document.getElementById('adottante-data-nascita')
            if (!adottanteDataNascita) {
                showFieldError(dataNascitaEl, 'La data di nascita è obbligatoria')
                hasErrors = true
            }

            // Residenza: required, max 200
            const residenzaEl = document.getElementById('adottante-residenza')
            if (!adottanteResidenza) {
                showFieldError(residenzaEl, 'La residenza è obbligatoria')
                hasErrors = true
            } else if (adottanteResidenza.length > 200) {
                showFieldError(residenzaEl, 'Massimo 200 caratteri')
                hasErrors = true
            }

            // Telefono: required, max 20
            const telefonoEl = document.getElementById('adottante-telefono')
            if (!adottanteTelefono) {
                showFieldError(telefonoEl, 'Il numero di telefono è obbligatorio')
                hasErrors = true
            } else if (adottanteTelefono.length > 20) {
                showFieldError(telefonoEl, 'Massimo 20 caratteri')
                hasErrors = true
            }

            // Numero scheda: required
            const schedaEl = document.getElementById('numero-scheda')
            if (!numeroScheda) {
                showFieldError(schedaEl, 'Il numero scheda è obbligatorio')
                hasErrors = true
            }

            // Privacy checkbox: must be checked
            if (!privacyChecked) {
                showFieldError(privacyCheckbox, 'È necessario autorizzare l\'utilizzo dei dati personali')
                hasErrors = true
            }

            if (hasErrors) {
                scrollToFirstError(form)
                return
            }

            // ========== Submit to Supabase ==========
            const updateData = {
                stato: 'adottato',
                nome_gatto_adozione: nomeGattoAdozione || null,
                tipologia_pelo: document.getElementById('tipologia-pelo').value || null,
                adottante_nome: adottanteNome,
                adottante_cognome: adottanteCognome,
                adottante_cf: adottanteCf,
                adottante_data_nascita: adottanteDataNascita,
                adottante_luogo_nascita: adottanteLuogoNascita || null,
                adottante_residenza: adottanteResidenza,
                adottante_telefono: adottanteTelefono,
                adottante_numero_documento: adottanteDocumento || null,
                adottante_scadenza_documento: adottanteScadenzaDoc || null,
                numero_scheda: numeroScheda,
                privacy_autorizzata: true,
                data_adozione: dataAdozione,
                adottato_da: ctx.user.id
            }

            const { error } = await supabase
                .from('chips')
                .update(updateData)
                .eq('id', selectedCat.id)
                .eq('stato', 'impiantato')  // safety: only update if still impiantato

            if (error) {
                showToast('Errore durante il salvataggio. Riprova.', 'error')
                return
            }

            // Success
            showToast('Adozione registrata con successo!', 'success')

            // Reset state and reload cats
            selectedCat = null
            form.reset()
            form.hidden = true
            dataAdozioneInput.value = today
            dataAdozioneInput.max = today
            gattoSearch.value = ''
            docInputs.hidden = true
            btnLeggiCie.textContent = '📄 Leggi documenti d\'identità'
            extractStatus.hidden = true

            await loadCats()
        })
    </script>
</body>
</html>
