<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Gestione Microchip</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dark.css" id="dark-theme-link" disabled>
</head>
<body>
    <header class="app-header">
        <h1 class="app-title">Gestione Microchip</h1>
    </header>

    <main class="main-content">
        <section class="form-container">
            <h2 class="form-title">Accedi</h2>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required placeholder="nome@esempio.it">
                    <span class="error-msg" id="email-error"></span>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Password">
                    <span class="error-msg" id="password-error"></span>
                </div>
                <div class="form-group">
                    <span class="error-msg" id="login-error"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Accedi</button>
            </form>
        </section>
    </main>

    <footer class="app-footer">
        <p>Versione <span id="version">—</span></p>
    </footer>

    <script type="module" src="../js/app.js"></script>
    <script type="module">
        import { VERSION } from "../js/version.js"
        document.getElementById("version").textContent = VERSION
    </script>
    <script type="module">
        import { login, getCurrentUser } from '../js/auth.js'
        import { HOME_PAGE } from '../js/config.js'

        // Se l'utente è già autenticato, redirect alla home
        const existingUser = await getCurrentUser()
        if (existingUser) {
            window.location.href = HOME_PAGE
        }

        const form = document.getElementById('login-form')
        const loginError = document.getElementById('login-error')

        form.addEventListener('submit', async (e) => {
            e.preventDefault()
            loginError.textContent = ''

            const email = document.getElementById('email').value.trim()
            const password = document.getElementById('password').value

            if (!email || !password) {
                loginError.textContent = 'Inserisci email e password'
                return
            }

            const { user, error } = await login(email, password)
            if (error) {
                loginError.textContent = error
                return
            }

            window.location.href = HOME_PAGE
        })
    </script>
</body>
</html>
