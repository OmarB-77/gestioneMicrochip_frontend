<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Gestione Microchip</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dark.css" id="dark-theme-link" disabled>
</head>
<body>
    <header class="app-header">
        <h1 class="app-title">Gestione Microchip</h1>
    </header>

    <main class="main-content">
        <section class="form-container">
            <h2 class="form-title">Accedi</h2>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required placeholder="nome@esempio.it">
                    <span class="error-msg" id="email-error"></span>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Password">
                    <span class="error-msg" id="password-error"></span>
                </div>
                <div class="form-group">
                    <span class="error-msg" id="login-error"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Accedi</button>
            </form>
        </section>
    </main>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
