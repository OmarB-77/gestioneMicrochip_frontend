<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerca Chip — Gestione Microchip</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dark.css" id="dark-theme-link" disabled>
</head>
<body>
    <header class="app-header">
        <a href="../index.html" class="btn-back" aria-label="Torna alla home">← Home</a>
        <h1 class="app-title">Cerca Chip</h1>
    </header>

    <main class="main-content">
        <section class="form-container">
            <div class="form-group">
                <label for="search-input">Cerca per numero chip (min 3 caratteri)</label>
                <input type="text" id="search-input" name="search" inputmode="numeric" placeholder="Inserisci numero chip...">
            </div>

            <div id="search-results" class="search-results">
                <!-- Risultati della ricerca -->
            </div>
            <p id="no-results" class="info-message" hidden>Nessun chip corrisponde al criterio inserito.</p>

            <!-- Dettaglio chip (mostrato dopo selezione) -->
            <section id="chip-detail" class="chip-detail" hidden>
                <h3 class="form-section-title">Dettaglio chip</h3>
                <form id="modifica-chip-form" novalidate>
                    <div class="form-group">
                        <label for="detail-numero-chip">Numero chip</label>
                        <input type="text" id="detail-numero-chip" readonly>
                    </div>
                    <!-- I campi di dettaglio vengono popolati dinamicamente -->
                    <button type="submit" class="btn btn-primary btn-full">Salva modifiche</button>
                </form>
            </section>
        </section>
    </main>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
