<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Utenti — Gestione Microchip</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dark.css" id="dark-theme-link" disabled>
</head>
<body>
    <header class="app-header">
        <a href="../index.html" class="btn-back" aria-label="Torna alla home">← Home</a>
        <h1 class="app-title">Gestione Utenti</h1>
    </header>

    <main class="main-content">
        <section class="form-container">
            <h2 class="form-title">Crea account guest</h2>
            <form id="crea-guest-form" novalidate>
                <div class="form-group">
                    <label for="guest-email">Email</label>
                    <input type="email" id="guest-email" name="email" required placeholder="guest@esempio.it">
                    <span class="error-msg" id="guest-email-error"></span>
                </div>
                <div class="form-group">
                    <label for="guest-password">Password</label>
                    <input type="password" id="guest-password" name="password" required>
                    <span class="error-msg" id="guest-password-error"></span>
                </div>
                <div class="form-group">
                    <label for="guest-nome">Nome visualizzato</label>
                    <input type="text" id="guest-nome" name="display_name" required>
                    <span class="error-msg" id="guest-nome-error"></span>
                </div>
                <div class="form-group">
                    <label for="guest-associazione">Associazione</label>
                    <select id="guest-associazione" name="associazione_id" required>
                        <option value="">— Seleziona —</option>
                    </select>
                    <span class="error-msg" id="guest-associazione-error"></span>
                </div>
                <button type="submit" id="btn-crea-guest" class="btn btn-primary btn-full" disabled>Crea account</button>
            </form>
        </section>

        <section class="form-container">
            <h2 class="form-title">Utenti guest esistenti</h2>
            <div id="guest-list" class="guest-list">
                <!-- Lista utenti caricata dinamicamente -->
            </div>
        </section>
    </main>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
