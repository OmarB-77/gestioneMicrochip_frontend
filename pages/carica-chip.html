<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carica Chip — Gestione Microchip</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dark.css" id="dark-theme-link" disabled>
</head>
<body>
    <header class="app-header">
        <a href="../index.html" class="btn-back" aria-label="Torna alla home">← Home</a>
        <h1 class="app-title">Carica Chip</h1>
    </header>

    <main class="main-content">
        <section class="form-container">
            <form id="carica-chip-form" novalidate>
                <div class="form-group">
                    <label for="numero-chip">Numero chip (15 cifre)</label>
                    <input type="text" id="numero-chip" name="numero_chip" inputmode="numeric" maxlength="15" required placeholder="123456789012345">
                    <span class="error-msg" id="numero-chip-error"></span>
                </div>
                <div class="form-group">
                    <label for="data-carico">Data di carico</label>
                    <input type="date" id="data-carico" name="data_carico" required>
                    <span class="error-msg" id="data-carico-error"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Carica in magazzino</button>
            </form>
        </section>
    </main>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
