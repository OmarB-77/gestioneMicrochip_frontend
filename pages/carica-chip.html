<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carica Chip — Gestione Microchip</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dark.css" id="dark-theme-link" disabled>
</head>
<body>
    <header class="app-header">
        <a href="../index.html" class="btn-back" aria-label="Torna alla home">← Home</a>
        <h1 class="app-title">Carica Chip</h1>
    </header>

    <main class="main-content">
        <section class="form-container">
            <form id="carica-chip-form" novalidate>
                <div class="form-group">
                    <label for="numero-chip">Numero chip (15 cifre)</label>
                    <input type="text" id="numero-chip" name="numero_chip"
                           inputmode="numeric" maxlength="15" pattern="\d{15}"
                           required placeholder="123456789012345"
                           autocomplete="off">
                    <span class="error-msg" id="numero-chip-error"></span>
                </div>
                <div class="form-group">
                    <label for="data-carico">Data di carico</label>
                    <input type="date" id="data-carico" name="data_carico" required>
                    <span class="error-msg" id="data-carico-error"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Salva</button>
            </form>
        </section>
    </main>

    <script type="module">
        import { protectPage } from '../js/router.js'
        import { initDarkMode, showToast, showFieldError, clearAllErrors, scrollToFirstError } from '../js/ui-utils.js'
        import { validateChipNumber } from '../js/validation.js'
        import { supabase } from '../js/supabase-client.js'

        // Inizializza dark mode
        initDarkMode()

        // Guard admin: solo admin può accedere a questa pagina
        const ctx = await protectPage(['admin'])
        if (!ctx) {
            // protectPage ha già eseguito il redirect
            throw new Error('Accesso negato')
        }

        // Imposta la data di carico di default a oggi
        const dataCaricoInput = document.getElementById('data-carico')
        const today = new Date().toISOString().split('T')[0]
        dataCaricoInput.value = today
        dataCaricoInput.max = today

        // Gestione submit form
        const form = document.getElementById('carica-chip-form')

        form.addEventListener('submit', async (e) => {
            e.preventDefault()

            // 1. Pulisci errori precedenti
            clearAllErrors(form)

            // 2. Leggi valori
            const numeroChipInput = document.getElementById('numero-chip')
            const numeroChip = numeroChipInput.value.trim()
            const dataCarico = dataCaricoInput.value

            // 3. Validazione
            let hasErrors = false

            // Validazione numero chip
            const chipResult = validateChipNumber(numeroChip)
            if (!chipResult.valid) {
                showFieldError(numeroChipInput, chipResult.error)
                hasErrors = true
            }

            // Validazione data di carico: obbligatoria e non futura
            if (!dataCarico) {
                showFieldError(dataCaricoInput, 'La data di carico è obbligatoria')
                hasErrors = true
            } else {
                const selectedDate = new Date(dataCarico)
                const todayDate = new Date()
                todayDate.setHours(0, 0, 0, 0)
                if (selectedDate > todayDate) {
                    showFieldError(dataCaricoInput, 'La data non può essere nel futuro')
                    hasErrors = true
                }
            }

            // Se ci sono errori, scroll al primo e interrompi
            if (hasErrors) {
                scrollToFirstError(form)
                return
            }

            // 4. Salvataggio in Supabase
            const { error } = await supabase
                .from('chips')
                .insert({
                    numero_chip: numeroChip,
                    stato: 'disponibile',
                    data_carico: dataCarico
                })

            if (error) {
                // 6. Errore duplicazione chip (codice PostgreSQL 23505 = unique_violation)
                if (error.code === '23505') {
                    showToast('Il numero chip è già presente nel sistema', 'error')
                } else {
                    // 7. Errore generico
                    showToast('Errore durante il salvataggio. Riprova.', 'error')
                }
                // Preserva i dati nel form (non resettare)
                return
            }

            // 5. Successo: toast di conferma e reset form
            showToast('Chip caricato con successo', 'success')
            form.reset()
            // Ripristina la data a oggi dopo il reset
            dataCaricoInput.value = today
        })
    </script>
</body>
</html>
